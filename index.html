<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dff3ff" />
    <meta name="description" content="适合小学一年级孩子的每日学习打卡工具" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="学习工作台" />
    <title>每日学习工作台</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" class="app-shell" aria-live="polite"></main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <template id="home-template">
      <section class="home-view view-enter">
        <header class="hero panel-depth">
          <div class="hero-copy">
            <p class="eyebrow">MY STUDY DESK</p>
            <h1><span id="learner-name">天天</span>每日学习工作台</h1>
            <p>吃下知识蘑菇，一天长大一点！</p>
          </div>
          <div class="hero-coin" aria-hidden="true"><span>🪙</span></div>
          <button id="settings-button" class="settings-button" type="button" title="家长设置" aria-label="打开家长设置">⚙</button>
          <div class="hero-shelf" aria-hidden="true"></div>
        </header>

        <section class="stats" aria-label="学习统计">
          <article class="stat-card panel-depth">
            <span>今日学习</span><strong id="today-minutes">0分钟</strong>
          </article>
          <article class="stat-card panel-depth">
            <span>连续打卡</span><strong id="streak-days">0天</strong>
          </article>
          <article class="stat-card coin-card panel-depth">
            <span>学习金币</span><strong><span aria-hidden="true">🪙</span> <b id="coin-count">20</b></strong>
          </article>
        </section>

        <section class="daily-plan panel-depth" aria-labelledby="daily-plan-title">
          <div class="daily-plan-head">
            <div><span class="section-kicker">TODAY</span><h2 id="daily-plan-title">今日学习任务</h2></div>
            <strong id="daily-plan-count">0 / 2</strong>
          </div>
          <div class="progress-track" aria-hidden="true"><span id="daily-plan-bar"></span></div>
          <p id="daily-plan-message">完成学习关卡后即可打卡</p>
          <button id="continue-button" class="continue-button" type="button" hidden><span aria-hidden="true">▶</span><span>继续上次学习</span></button>
        </section>

        <button id="checkin-button" class="checkin-button button-depth" type="button">
          <span aria-hidden="true">🪙</span><span>今日打卡</span>
        </button>

        <section id="subject-grid" class="subject-grid" aria-label="学习关卡"></section>
      </section>
    </template>

    <script src="app.js"></script>
  </body>
</html>
